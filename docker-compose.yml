services:
  frichescore:
    build: .
    image: frichescore:local
    container_name: frichescore
    ports:
      # Port de la machine hôte configurable (8010 par défaut, pour ne pas gêner un service déjà sur 8000)
      - "${FRICHESCORE_PORT:-8010}:8000"
    volumes:
      - frichescore-data:/data
      # Décommentez pour éditer le calendrier des financements sans reconstruire l'image :
      # - ./app/data/funding_windows.json:/app/app/data/funding_windows.json
    restart: unless-stopped

volumes:
  frichescore-data:
