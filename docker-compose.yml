services:
  frichescore:
    build: .
    image: frichescore:local
    container_name: frichescore
    environment:
      # Proxy d'entreprise éventuel (le conteneur ne connaît pas le proxy configuré dans Windows).
      # Exemple PowerShell, avant « docker compose up » : $env:HTTPS_PROXY = "http://proxy.monentreprise.fr:8080"
      - HTTPS_PROXY=${HTTPS_PROXY:-}
      - HTTP_PROXY=${HTTP_PROXY:-}
      - NO_PROXY=${NO_PROXY:-localhost,127.0.0.1}
      # Connexions IPv4 uniquement (évite les blocages IPv6 de Docker Desktop). Mettre 0 pour désactiver.
      - FRICHESCORE_FORCE_IPV4=${FRICHESCORE_FORCE_IPV4:-1}
      # Message d'ouverture TLS compact (évite les blocages de gros paquets TLS sous Docker/VPN). Mettre 0 pour désactiver.
      - FRICHESCORE_TLS_COMPACT=${FRICHESCORE_TLS_COMPACT:-1}
      # Extraction de documents par l'IA (optionnelle) : clé lue dans le fichier .env (jamais versionné)
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - FRICHESCORE_IA_QUOTA_MOIS=${FRICHESCORE_IA_QUOTA_MOIS:-200}
    ports:
      # Port de la machine hôte configurable (8010 par défaut, pour ne pas gêner un service déjà sur 8000)
      - "${FRICHESCORE_PORT:-8010}:8000"
    volumes:
      - frichescore-data:/data
      # Ce volume contient la base (friches, portfolio, saisies terrain, paramètres calibrés)
      # et le calendrier des financements édité depuis l'interface (funding_windows.json).
    restart: unless-stopped

volumes:
  frichescore-data:
